name: Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bootstrap tooling
        run: python -m py_compile scripts/validate_governance.py scripts/hive_bootstrap.py scripts/hive_mcp.py
      - name: Validate CORE governance
        run: python scripts/validate_governance.py
      - name: Test HIVE bootstrap and MCP bridge
        run: python -m unittest discover -s tests -p "test_*.py" -v
