name: Work Order
description: Propose a governed bounded increment
title: "[WO] "
labels: []
body:
  - type: input
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: canonical
    attributes:
      label: Canonical basis
      description: Checkpoint, decisions, scope, DoD, architecture and requirements as applicable.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / Out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and evidence
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Stop condition
    validations:
      required: true
