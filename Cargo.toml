[workspace]
resolver = "2"
members = [
    "crates/core-contracts",
    "crates/core-identity",
    "crates/core-config",
    "crates/core-registry",
    "crates/core-journal",
    "crates/core-ipc",
    "crates/core-health",
    "crates/core-runtime",
    "crates/core-cli",
    "crates/core-workspace",
    "crates/core-work-order",
    "crates/core-run-state",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
